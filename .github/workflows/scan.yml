name: Daily WordPress Security Scan

on:
  schedule:
    # 03:00 UTC daily
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # allows manual "Run workflow" button for testing

# Needed so the built-in GITHUB_TOKEN can push commits back to this repo.
# (Also confirm in repo Settings → Actions → General → Workflow permissions
# that "Read and write permissions" is selected — a restrictive repo-level
# setting overrides this block and pushes will fail with a 403 otherwise.)
permissions:
  contents: write

# Prevent overlapping runs if a manual trigger and the schedule collide.
concurrency:
  group: wp-security-scan
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python3 scanner.py https://chopshaven.ca

      - name: Rebuild site
        run: python3 build_site.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add reports/ site/

          if git diff --cached --quiet; then
            echo "No changes to commit — skipping push."
            exit 0
          fi

          git commit -m "Automated scan: $(date -u '+%Y-%m-%d %H:%M') UTC"

          # Guard against a rare race with another push landing on main
          # between checkout and now.
          git pull --rebase origin main
          git push origin HEAD:main
