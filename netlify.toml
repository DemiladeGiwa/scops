# netlify.toml
# -------------
# The VPS/GitHub Actions job pre-builds the whole site (index.html,
# archive.html, archive/*.html) via build_site.py and pushes it in the
# repo's ./site folder. Netlify should NOT run its own build — just
# publish that folder as-is.

[build]
  publish = "site"

# ---------------------------------------------------------------------------
# ACCESS CONTROL - enforced server-side at Netlify's edge via Basic Auth.
# This is the ACTIVE gate for the whole site. No Identity, no invite links,
# no client-side JS gate — the edge function checks credentials before any
# file is served.
#
# Requires: SITE_USER and SITE_PASS set in
# Site configuration -> Environment variables in the Netlify dashboard.
# ---------------------------------------------------------------------------

[[edge_functions]]
  path = "/*"
  function = "basic-auth"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"